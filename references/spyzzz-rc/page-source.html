*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.55 Nunito,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;
 background:var(--bg) radial-gradient(circle at 12% 30%,var(--bg2) 0 2px,transparent 3px) 0 0/46px 46px,
 radial-gradient(circle at 70% 80%,var(--bg2) 0 1.5px,transparent 2.5px) 0 0/31px 31px;background-color:var(--bg)}
a{color:var(--acc);font-weight:700;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--acc) 35%,transparent)}

/* en-tête : surface herbeuse puis couches de sol */
header{position:relative;background:linear-gradient(var(--acc2),color-mix(in srgb,var(--acc2) 80%,#000));color:#fff8e8;padding-bottom:58px}

h2::before{content:"";width:22px;height:22px;flex-shrink:0;align-self:center;background:var(--acc);border-radius:50% 40% 55% 45%/45% 55% 45% 55%;box-shadow:12px -8px 0 -6px var(--acc2)}

h3{font:700 17px/1.2 "Baloo 2",cursive;margin:0 0 10px;color:var(--ink)}

/* cartes = chambres de fourmilière */
.card{background:var(--card);border:2px solid var(--line);border-radius:28px 34px 26px 38px/34px 26px 38px 28px;padding:18px 20px;min-width:0;position:relative;
 box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--line) 55%,transparent),0 6px 18px var(--shadow)}
.grid2 .card:nth-child(2n){border-radius:38px 26px 34px 28px/26px 38px 28px 34px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr));gap:14px;margin-top:14px}
.kpi{padding:16px 18px 14px;overflow:hidden}

th{color:var(--muted);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none;border-bottom:2px dashed var(--line)}
th:hover{color:var(--acc)}th[data-d="1"]::after{content:" ▲"}th[data-d="-1"]::after{content:" ▼"}

input:focus{border-color:var(--acc)}
.row input{padding-left:18px;background-image:none;flex:1;min-width:140px}

.card:has(> ul.ev){display:flex;flex-direction:column}
.card:has(> ul.ev) > ul.ev{flex:1}
ul.ev li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul.ev li::before{content:"";position:absolute;left:4px;top:15px;width:8px;height:6px;border-radius:50%;background:var(--acc);opacity:.6}
[hidden]{display:none!important}

.btn.big{font-size:18px;padding:10px 28px}

.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:999px;padding:10px 22px;font:800 17px "Baloo 2",cursive;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 60%,#000);transition:transform .1s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 60%,#000)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
ol.lb{margin:0;padding-left:30px}

.modes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:4px 0}

.keyhud{position:absolute;left:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,32px);grid-template-rows:repeat(2,32px);gap:4px;z-index:2;pointer-events:none}

<script>
if (window.self !== window.top) document.documentElement.classList.add("embed");
// bandeau de la loterie (S5 seulement) : cagnotte et temps restant avant le tirage
(async () => { try {
  const s = +(location.pathname.match(/^\/s([1-5])(\/|$)/) || [])[1] || +new URLSearchParams(location.search).get("srv") || +localStorage.getItem("srv") || 5;
  if (s !== 5 || window.self !== window.top) return;
  const c = (await (await fetch("/api/lottery")).json()).current; if (!c || c.status !== "open") return;
  const b = document.getElementById("lotban"), n = x => Number(x).toLocaleString("fr-FR");
  const left = () => { const ms = Date.parse(c.ends_at) - Date.now(); if (ms <= 0) return "tirage imminent";
    const d = Math.floor(ms / 864e5), hh = Math.floor(ms / 36e5) % 24, mm = Math.floor(ms / 6e4) % 60;
    return "tirage dans " + (d ? d + " j " : "") + hh + " h " + String(mm).padStart(2, "0"); };
  const paint = () => b.innerHTML = `<span class="lb-t">🎟️ Loterie du S5 : ${n(c.prize)} de ${c.resource} à gagner</span>
    <span class="lb-s">${n(c.price)} de ${c.resource} le ticket · ${n(c.tickets)} ticket${c.tickets > 1 ? "s" : ""} vendu${c.tickets > 1 ? "s" : ""} · ${left()}</span>
    <span class="lb-c">Je participe →</span>`;
  paint(); b.hidden = false; setInterval(paint, 30e3);
} catch {} })();
const $ = s => document.querySelector(s), app = $("#app");
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = n => n == null ? "–" : Number(n).toLocaleString("fr-FR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// version AAAAMMJJHHmm en UTC -> date du jour (heure de Paris) correspondant au relevé de minuit
const vd = v => new Date(Date.UTC(+v.slice(0,4), +v.slice(4,6)-1, +v.slice(6,8), +v.slice(8,10), +v.slice(10,12)));
const vdate = v => vd(v).toLocaleString("fr-FR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" });
const delta = (a, b) => b == null || a == null ? "" : a === b ? `<span class="muted">=</span>` :
  `<span class="${a > b ? "up" : "down"}">${a > b ? "+" : ""}${fmt(a - b)}</span>`;
const aLink = t => t ? `<a href="#/a/${encodeURIComponent(t)}">${esc(t)}</a>` : `<span class="muted">—</span>`;
const pLink = (id, n) => `<a href="#/j/${id}">${esc(n)}</a>`;
// serveur affiché : ?srv= dans l'adresse, sinon le dernier choisi, sinon le S5
const SERVERS_LIST = [1, 2, 3, 4, 5];
const SRV = (() => { let s = +(location.pathname.match(/^\/s([1-5])(\/|$)/) || [])[1] || +new URLSearchParams(location.search).get("srv");
  if (!SERVERS_LIST.includes(s)) { try { s = +localStorage.getItem("srv"); } catch {} }
  if (!SERVERS_LIST.includes(s)) s = 5;
  try { localStorage.setItem("srv", s); } catch {} return s; })();
const withSrv = p => /^\/api\/(online|scores)/.test(p) || !p.startsWith("/api/") ? p : p + (p.includes("?") ? "&" : "?") + "srv=" + SRV;
const get = async p => { const r = await fetch(withSrv(p)); const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; };
// recherche de pseudos côté serveur (index par début de nom) : marche aussi sur les serveurs à 200 000 joueurs
const searchPlayers = async q => (await get("/api/search?q=" + encodeURIComponent(q))).players.map(p => ({ id: p.id, label: p.pseudo, sub: (p.alliance ? p.alliance + " · " : "") + fmt(p.field) + " cm²", f: p.field, alliance: p.alliance }));
let charts = [];
function chart(id, labels, datasets, opts = {}) {
  Chart.defaults.font.family = "Nunito, system-ui, sans-serif";
  // 4 couleurs du thème, puis des couleurs supplémentaires pour les graphiques à 10 séries
  const pal = [...["--s1","--s2","--s3","--s4"].map(css), "#d64f6b", "#2fa3a3", "#c9a227", "#8a6d3b", "#6b8e23", "#e58fb0"];
  const c = new Chart(document.getElementById(id), { type: opts.type || "line",
    data: { labels, datasets: datasets.map((d, i) => ({ borderColor: d.color || pal[i % pal.length], backgroundColor: d.color || pal[i % pal.length],
      borderWidth: 3, borderRadius: 8, pointRadius: labels.length > 30 ? 0 : 3, tension: .35, ...d })) },
    options: { maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: datasets.length > 1, labels: { color: css("--muted"), boxWidth: 12 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmt(c.parsed.y)}` } } },
      scales: { x: { ticks: { color: css("--muted") }, grid: { display: false } },
        y: { ticks: { color: css("--muted"), callback: v => fmt(v) }, grid: { color: css("--line") }, beginAtZero: !!opts.zero } } } });
  charts.push(c);
}
function sortable(tbl) {
  tbl.querySelectorAll("th").forEach((th, i) => th.onclick = () => {
    const rows = [...tbl.tBodies[0].rows], dir = th.dataset.d = th.dataset.d === "1" ? "-1" : "1";
    const val = r => { const t = r.cells[i].dataset.v ?? r.cells[i].textContent; const n = parseFloat(t); return isNaN(n) ? t.toLowerCase() : n; };
    rows.sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * dir).forEach(r => tbl.tBodies[0].append(r));
  });
}
const td = (v, cls = "n") => `<td class="${cls}" data-v="${v ?? ""}">${fmt(v)}</td>`;

// listes longues : 5 lignes max + bouton « Charger plus »
function limitLists(root) {
  root.querySelectorAll("ul.ev").forEach(ul => {
    const items = [...ul.children]; if (items.length <= 5) return;
    let shown = 5; items.forEach((li, i) => li.hidden = i >= shown);
    const btn = document.createElement("button"); btn.className = "more";
    const label = () => btn.textContent = `Charger plus (${items.length - shown} restants)`; label();
    btn.onclick = () => { shown += 5; items.forEach((li, i) => li.hidden = i >= shown); if (shown >= items.length) btn.remove(); else label(); };
    ul.after(btn);
  });
}

async function home() {
  const [s, e, al] = await Promise.all([get("/api/summary"), get("/api/events"), get("/api/alliances")]);
  const t = s.timeline, L = t.map(x => vdate(x.version)), last = t.at(-1), pr = t.at(-2) || {};
  app.innerHTML = `
  <p class="note" id="homenote">Serveur ${SRV} · dernier relevé : ${vdate(s.latest)} · <b id="nextup-home"></b> · ${t.length} relevés</p>
  <div class="kpis">
    ${[["Joueurs", last.players, pr.players], ["Joueurs actifs", last.active, pr.active], ["En alliance", last.allied, pr.allied],
       ["Alliances", last.alliances, pr.alliances], ["TDC total (cm²)", last.field, pr.field]]
      .map(([l, v, p]) => `<div class="card kpi"><div class="l">${l}</div><div class="v">${fmt(v)}</div><div>${delta(v, p)}</div></div>`).join("")}
  </div>
  <div class="grid2">
    <div class="card"><div class="ch"><h3>Joueurs</h3><span class="hj" data-c="c1"><button data-m="H">H</button><button data-m="J" class="on">J</button></span></div><div class="chart"><canvas id="c1"></canvas></div></div>
    <div class="card"><div class="ch"><h3>Terrain de chasse total</h3><span class="hj" data-c="c2"><button data-m="H">H</button><button data-m="J" class="on">J</button></span></div><div class="chart"><canvas id="c2"></canvas></div></div>
    <div class="card"><div class="ch"><h3>TDC des 5 premières alliances</h3><span class="hj" data-c="c3"><button data-m="H">H</button><button data-m="J" class="on">J</button></span></div><div class="chart"><canvas id="c3"></canvas></div></div>
    <div class="card"><div class="ch"><h3>Top 5 des alliances en TDC / membre</h3></div><div class="chart"><canvas id="c5"></canvas></div></div>
    <div class="card"><div class="ch"><h3>Nombre d'alliances</h3><span class="hj" data-c="c4"><button data-m="H">H</button><button data-m="J" class="on">J</button></span></div><div class="chart"><canvas id="c4"></canvas></div></div>
  </div>
  <h2>Sur les dernières 24 h <span class="muted">· depuis ${e.previous ? vdate(e.previous) : "–"}</span></h2>
  ${!e.previous ? `<p class="muted">Il faut au moins deux relevés pour comparer.</p>` : `
  <div class="grid2">
    <div class="card"><h3>Changements d'alliance (${e.moves.length})</h3><ul class="ev">${e.moves.map(m =>
      `<li>${pLink(m.id, m.pseudo)} : ${aLink(m.before)} → ${aLink(m.after)}</li>`).join("") || "<li class=muted>Aucun</li>"}</ul></div>
    <div class="card"><h3>Alliances créées / disparues</h3><ul class="ev">
      ${al.alliances.filter(a => a.isnew).map(a => `<li><span class="up">Nouvelle</span> ${aLink(a.tag)} ${esc(a.name)} · ${a.players} membres</li>`).join("")}
      ${al.gone.map(a => `<li><span class="down">Disparue</span> ${esc(a.tag)} ${esc(a.name)} · avait ${a.players} membres</li>`).join("")}
      ${!al.gone.length && !al.alliances.some(a => a.isnew) ? "<li class=muted>Aucune</li>" : ""}</ul></div>
    <div class="card"><h3>Plus fortes hausses de TDC</h3><ul class="ev">${e.topGain.map(p =>
      `<li>${pLink(p.id, p.pseudo)} ${p.alliance ? `<span class="tag">${esc(p.alliance)}</span>` : ""} <span class="up">+${fmt(p.delta)}</span></li>`).join("") || "<li class=muted>Aucune</li>"}</ul></div>
    <div class="card"><h3>Plus fortes baisses de TDC</h3><ul class="ev">${e.topLoss.map(p =>
      `<li>${pLink(p.id, p.pseudo)} ${p.alliance ? `<span class="tag">${esc(p.alliance)}</span>` : ""} <span class="down">${fmt(p.delta)}</span></li>`).join("") || "<li class=muted>Aucune</li>"}</ul></div>
    <div class="card"><h3>Nouveaux joueurs (${e.newPlayers.length})</h3><ul class="ev">${e.newPlayers.map(p => `<li>${pLink(p.id, p.pseudo)} ${p.alliance ? `<span class="tag">${esc(p.alliance)}</span>` : ""}</li>`).join("") || "<li class=muted>Aucun</li>"}</ul></div>
    <div class="card"><h3>Joueurs disparus (${e.gonePlayers.length})</h3><ul class="ev">${e.gonePlayers.map(p => `<li>${esc(p.pseudo)} ${p.alliance ? `<span class="tag">${esc(p.alliance)}</span>` : ""} <span class="muted">· ${fmt(p.field)} cm²</span></li>`).join("") || "<li class=muted>Aucun</li>"}</ul></div>
  </div>`}`;
  limitLists(app); nextupTick();
  // H = tous les relevés horaires ; J = dernier relevé de chaque jour (heure de Paris)
  const day = v => vd(v).toLocaleDateString("fr-FR", { timeZone: "Europe/Paris" });
  const daily = vs => vs.filter((v, i) => i === vs.length - 1 || day(v) !== day(vs[i + 1]));
  const dlabel = v => vd(v).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", timeZone: "Europe/Paris" });
  const top = al.alliances.slice(0, 5).map(a => a.tag), avs = [...new Set(al.timeline.map(r => r.version))];
  const draws = {
    c1: (tt, lab) => chart("c1", tt.map(x => lab(x.version)), [{ label: "Inscrits", data: tt.map(x => x.players) }, { label: "Actifs", data: tt.map(x => x.active) }, { label: "En alliance", data: tt.map(x => x.allied) }]),

    c3: (_, lab, m) => { const vs = m === "J" ? daily(avs) : avs;

// ---------- Autocomplétion ----------
// Filtre une liste déjà chargée côté navigateur : aucune requête pendant la frappe.
function autocomplete(input, items, onPick) {
  const box = document.createElement("div"); box.className = "ac"; box.hidden = true; input.after(box);
  input.parentElement.style.position = "relative"; input.setAttribute("autocomplete", "off");
  let list = [], sel = 0;
  const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const render = () => { box.innerHTML = list.map((it, i) => `<div class="${i === sel ? "on" : ""}" data-i="${i}">${esc(it.label)}${it.sub ? ` <span class="muted">${esc(it.sub)}</span>` : ""}</div>`).join(""); box.hidden = !list.length; };
  let timer, seq = 0;
  input.addEventListener("input", () => { const raw = input.value.trim(), q = norm(raw); sel = 0;
    if (!q) { list = []; return render(); }
    if (typeof items === "function") { // recherche distante, 250 ms après la dernière frappe, à partir de 2 lettres
      clearTimeout(timer); if (raw.length < 2) { list = []; return render(); }
      const my = ++seq; timer = setTimeout(async () => { try { const r = await items(raw); if (my === seq) { list = r.slice(0, 8); render(); } } catch {} }, 250); return; }
    const starts = [], has = [];
    for (const it of items) { const n = it.n ??= norm(it.label); if (n.startsWith(q)) starts.push(it); else if (n.includes(q)) has.push(it); if (starts.length >= 8) break; }
    list = [...starts, ...has].slice(0, 8); render(); });
  const pick = i => { const it = list[i]; if (!it) return; input.value = ""; list = []; render(); onPick(it); };
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { sel = Math.min(list.length - 1, sel + 1); render(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); render(); e.preventDefault(); }
    else if (e.key === "Enter") { pick(sel); e.preventDefault(); }
    else if (e.key === "Escape") { list = []; render(); } });
  box.addEventListener("mousedown", e => { const d = e.target.closest("[data-i]"); if (d) { e.preventDefault(); pick(+d.dataset.i); } });
  input.addEventListener("blur", () => setTimeout(() => { list = []; render(); }, 100));
}

    <table><thead><tr><th>Relevé</th><th>Gagnant ⇄ perdant</th><th class="n">Montant</th></tr></thead><tbody id="tb-fl"></tbody></table><button class="more" data-k="fl">Charger plus</button></div>`;
  const STEP = 5; // lignes par tranche : rien n'est préchargé, chaque « Charger plus » demande la tranche suivante au serveur
  const filt = () => { const p = new URLSearchParams(); if (tag) p.set("a", tag); if (ids.length) p.set("p", ids.join(",")); return p; };
  const sync = () => { const p = filt(); history.replaceState(null, "", toPath("/tdc" + (p.size ? "?" + p : ""))); };
  const chips = () => $("#chips").innerHTML = ids.map(id => `<span class="chip">${esc(byId.get(id)[1])}<button data-id="${id}" title="Retirer">✕</button></span>`).join("");
  const rowMove = m => `<tr><td class="muted">${vdate(m.version)}</td>

    <td class="n muted">${fmt(m.before)} → ${fmt(m.after)}</td><td class="n">${delta(m.after, m.before)}</td></tr>`;
  const rowFlood = f => `<tr><td class="muted">${vdate(f.version)}</td>
    <td>${pLink(f.gid, f.gpseudo ?? "#" + f.gid)}${f.galliance ? ` <span class="tag">${esc(f.galliance)}</span>` : ""} ⇄ ${pLink(f.lid, f.lpseudo ?? "#" + f.lid)}${f.lalliance ? ` <span class="tag">${esc(f.lalliance)}</span>` : ""}
      <span class="tag ${f.cands === 1 ? "down" : ""}">${f.cands === 1 ? "probable" : "possible"}</span></td>

  let gen = 0; // un changement de filtre annule les chargements en cours
  async function more(k) {
    const L = lists[k], tb = $("#tb-" + k), btn = app.querySelector(`button.more[data-k=${k}]`), my = gen;
    btn.disabled = true; btn.textContent = "Chargement…";

  app.querySelectorAll("button.more[data-k]").forEach(b => b.onclick = () => more(b.dataset.k));
  await reset();
}

// ---------- Simulateur de chasse (moteur : public/chasse.js) ----------
let chasseP = null;
const loadChasse = () => chasseP ??= new Promise((ok, ko) => { const s = document.createElement("script"); s.src = "/chasse.js"; s.onload = ok; s.onerror = ko; document.head.append(s); });
const dur = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + "h " : "") + (h || m ? m + "m " : "") + x + "s"; };
// ---- RC au format du jeu (relevé sur le simulateur officiel) ----
const UNIT_PL = ["Jeunes Soldates Naines", "Soldates Naines", "Naines d’Elites", "Jeunes Soldates", "Soldates", "Concierges", "Concierges d’élites",
  "Artilleuses", "Artilleuses d’élites", "Soldates d’élites", "Tanks", "Tanks d’élites", "Tueuses", "Tueuses d’élites"];
const UNIT_SG = ["Jeune Soldate Naine", "Soldate Naine", "Naine d’Elite", "Jeune Soldate", "Soldate", "Concierge", "Concierge d’élite",
  "Artilleuse", "Artilleuse d’élite", "Soldate d’élite", "Tank", "Tank d’élite", "Tueuse", "Tueuse d’élite"];
const PREY_PL = ["Petites araignées", "Araignées", "Chenilles", "Criquets", "Guèpes", "Cigales", "Abeilles", "Dionées", "Hannetons", "Scarabées",
  "Mantes religieuses", "Lezards", "Souris", "Mulots", "Alouettes", "Rats", "Tamanoirs"];
const PREY_SG = ["Petite araignée", "Araignée", "Chenille", "Criquet", "Guèpe", "Cigale", "Abeille", "Dionée", "Hanneton", "Scarabée",
  "Mante religieuse", "Lezard", "Souris", "Mulot", "Alouette", "Rat", "Tamanoir"];
const up = x => Math.ceil(x - 1e-6), nb = n => fmt(n).replace(/\u202f/g, " ");
const rcList = (arr, sg, pl) => arr.map((n, i) => n ? `${nb(n)} ${n > 1 ? pl[i] : sg[i]}` : "").filter(Boolean).join(", ");
// durée comme le jeu : heures et minutes tronquées, secondes arrondies (d'où parfois « 60s »)
const rcDur = t => `${Math.floor(t / 3600)}H ${Math.floor(t % 3600 / 60)}m ${Math.round(t % 60)}s`;
function rcHtml(C, s, prey, log, r) {
  const L = [];
  L.push(`Troupes en attaque : ${rcList(s.army, UNIT_SG, UNIT_PL)}. <br>Troupes en défense : ${rcList(prey, PREY_SG, PREY_PL)}. <br><br>`);
  for (const l of log) {
    L.push(`Vous infligez <strong>${nb(up(l.base))} (+ ${nb(up(l.bonus))})</strong> dégâts et tuez <strong>${nb(l.killedPrey)}</strong> ennemie${l.killedPrey > 1 ? "s" : ""}.<br>`);
    L.push(`L’ennemie inflige <strong>${nb(up(l.dPrShown))} (+ 0)</strong> dégâts à vos fourmis et en tue <strong>${nb(l.killedUnits)}</strong>.<br>`);
  }
  L.push("<br>");
  if (r.win) {
    L.push(log.length === 1 ? "Belle victoire ! L’ennemi n’a même pas eu le temps d’organiser ses défenses efficacement !<br>"
      : "L’adversaire y a cru, mais vous sortez victorieux de ce combat acharné.<br>");
    L.push("<strong>Vous avez gagné cette bataille !</strong><br><br>");
    const pr = r.promo.map((n, i) => n ? `- ${nb(n)} ${n > 1 ? UNIT_PL[i] : UNIT_SG[i]} ${n > 1 ? "sont devenues des" : "est devenue une"} <strong>${n > 1 ? UNIT_PL[C.PROMO_TO[i]] : UNIT_SG[C.PROMO_TO[i]]}</strong><br>` : "").join("");
    if (pr) L.push("Les unités survivantes ont appris de cette bataille :<br>" + pr + "<br>");
    L.push(`Vos chasseuses ont conquis <strong>${nb(s.amt)} cm²</strong>, les carcasses des prédateurs vous rapportent <strong>${nb(up(0.8 * C.difficulty(s.tdc, s.amt)))}</strong> 🍎<br>`);
  } else {
    const done = log.reduce((a, l) => a + l.dUs, 0) / Math.max(1, prey.reduce((a, n, i) => a + n * C.PREY[i].hp, 0));
    L.push(done < .5 ? "Votre armée n’a fait qu’une égratignure à l’ennemi. Vous n’aviez aucune chance.<br>"
      : "Vos troupes se sont battues avec courage, mais l’ennemi était trop nombreux.<br>");
    L.push("<strong>Vos troupes ont échoué</strong><br><br> Vos chasseuses sont mortes, l'expédition a échoué.<br>");
  }
  return `<p><strong>Message que recevrait le chasseur:</strong></p><p>${L.join("")}</p><p>Temps nécessaire: ${rcDur((s.amt + Math.max(s.tdc, 50)) * Math.pow(0.9, s.vit))}</p>`;
}

      const b = document.createElement("span"); b.className = "st"; b.textContent = t; b.setAttribute("role", "button"); b.setAttribute("aria-label", d < 0 ? "Diminuer" : "Augmenter");
      const step = e => { const v = Math.max(+inp.min || 0, (Math.floor(+inp.value) || 0) + d * (e?.shiftKey ? 10 : 1)); inp.value = v; inp.dispatchEvent(new Event("input", { bubbles: true })); inp.dispatchEvent(new Event("change", { bubbles: true })); };
      let t1, t2; const stop = () => { clearTimeout(t1); clearInterval(t2); };
      b.addEventListener("pointerdown", e => { e.preventDefault(); step(e); t1 = setTimeout(() => t2 = setInterval(() => step(e), 60), 400); });
      ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, stop)); return b; };
    w.prepend(mk("−", -1)); w.append(mk("+", 1));

// ---------- Coller son armée (message de chasse, d'attaque ou page Armée du jeu) ----------
// Renvoie { army: 14 effectifs (ordre des unités), amount (cm² à conquérir), lieu, n (unités trouvées) }
const armyKey = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[’'`]/g, "")
  .split(/\s+/).filter(Boolean).map(w => w.replace(/s$/, "")).join(" ");
const ARMY_NAMES = UNIT_SG.map((n, i) => [armyKey(n), i]).sort((a, b) => b[0].length - a[0].length); // plus long d'abord (JSN avant JS)
const toInt = s => +String(s).replace(/[^\d]/g, "") || 0;
function parseArmy(text) {
  const army = new Array(14).fill(0); let n = 0, amount = null, lieu = null;
  const t = text.replace(/\u00a0|\u202f/g, " ");
  const m = t.match(/conqu[ée]rir\s+([\d ]+)\s*cm/i); if (m) amount = toInt(m[1]);
  const lm = t.match(/attaquer[^\n]*?\((loge[^)]*|d[oô]me[^)]*|fourmili[eè]re[^)]*|terrain[^)]*)\)\s*dans/i);
  if (lm) lieu = /loge/i.test(lm[1]) ? "loge" : /terrain/i.test(lm[1]) ? "terrain" : "dome";
  const find = s => { const k = armyKey(s); for (const [name, i] of ARMY_NAMES) if (k === name) return i; return -1; };
  // 1) « Troupes en chasses / en attaques : 2 535 Jeunes Soldates Naines, 597 Soldates Naines, ... »
  const tm = t.match(/Troupes en [^:]*:\s*([^\n.]+)/i);
  if (tm) for (const part of tm[1].replace(/\.\s*$/, "").split(",")) {
    const pm = part.trim().match(/^([\d ]+)\s+(.+)$/); if (!pm) continue;
    const i = find(pm[2]); if (i >= 0) { army[i] += toInt(pm[1]); n++; } }
  // 2) page Armée : une ligne par unité, ses effectifs (Terrain, Dôme, Loge) sur la ou les lignes suivantes ; on additionne
  if (!n) { let cur = -1;
    for (const raw of t.split(/\n/)) { const line = raw.trim(); if (!line) continue;
      const i = find(line.replace(/\d[\d ]*/g, "").trim());
      if (i >= 0) { cur = i; const nums = line.match(/\d[\d ]*/g); if (nums) { nums.forEach(x => army[i] += toInt(x)); n++; } continue; }
      if (/^(vie|d[ée]g[aâ]t|consommation)/i.test(line)) { cur = -1; continue; }
      if (cur >= 0) { const nums = line.split("\t").map(c => c.trim()).filter(c => /^\d[\d ]*$/.test(c)); if (nums.length) { nums.forEach(x => army[cur] += toInt(x)); n++; } } } }
  return { army, amount, lieu, n };
}
// Zone « Coller mon armée » : targets = [[libellé, (résultat) => void], ...]
function pasteBox(el, targets) {
  el.innerHTML = `<details class="paste"><summary>📋 Coller mon armée</summary>
    <textarea placeholder="Colle ici un message de chasse (« Troupes en chasses : … »), d'attaque (« Troupes en attaques : … ») ou ta page Armée"></textarea>
    <div class="simrow">${targets.map(([l], i) => `<button class="mini" data-t="${i}">${l}</button>`).join("")}<span class="pmsg muted"></span></div></details>`;

}

// ---------- Calculateur Dôme & Loge : retrouve les technologies à partir d'un RC ----------
function parseRc(text) {
  const t = text.replace(/ | /g, " "), num = s => +s.replace(/[^\d]/g, "");
  const list = s => { const army = new Array(14).fill(0);
    for (const part of (s || "").replace(/\.\s*$/, "").split(",")) { const m = part.trim().match(/^([\d ]+)\s+(.+)$/); if (!m) continue;
      const k = armyKey(m[2]); const f = ARMY_NAMES.find(([n]) => n === k); if (f) army[f[1]] += num(m[1]); }
    return army; };
  // une liste de troupes s'arrête au premier point (les nombres n'en contiennent pas) : marche aussi sans sauts de ligne
  const A = list((t.match(/Troupes en attaque\s*:\s*([^\n.]+)/i) || [])[1]), D = list((t.match(/Troupes en d[ée]fense\s*:\s*([^\n.]+)/i) || [])[1]);
  // lignes de dégâts dans l'ordre ; le camp de « Vous » dépend du point de vue (attaquant si la 1re ligne est « Vous infligez »)
  const lines = [...t.matchAll(/(Vous infligez|L.ennemie inflige)\s+([\d ]+)\s*\(\+\s*([\d ]+)\)\s*d[ée]g[aâ]ts.*?tue[zr]?\s+([\d ]+)/gi)]
    .map(m => ({ me: /^Vous/i.test(m[1]), base: num(m[2]), bonus: num(m[3]), kills: num(m[4]) }));
  const view = lines.length && lines[0].me ? "att" : "def";
  const att = lines.filter(l => l.me === (view === "att")), def = lines.filter(l => l.me !== (view === "att"));
  const lieu = /loge/i.test(t) ? "loge" : /d[ôo]me|fourmili[èe]re/i.test(t) ? "dome" : null;
  return { A, D, att, def, view, lieu, ok: A.some(Boolean) && D.some(Boolean) && att.length > 0 };
}

    const wanted = r.att.map((l, i) => [l.kills, r.def[i]?.kills]);
    const same = log => log.length === wanted.length && log.every((l, i) => l.killedD === wanted[i][0] && l.killedA === wanted[i][1]);
    // 1) Bouclier de l'attaquant et vie du défenseur, filtrés sur le 1er tour, puis vérification complète
    const lieuChoice = app.querySelector("[name=rcl]:checked").value, lieux = lieuChoice !== "auto" ? [lieuChoice] : r.lieu ? [r.lieu] : ["terrain", "dome", "loge"];
    const MAXB = 40, MAXL = 40, found = [];
    const aBous = [];
    for (let b = 0; b <= MAXB; b++) { const g = K.combat(r.A, r.D, { aArm, dArm, aBou: b, dBou: 0, lieu: "terrain", niveau: 0 }); if (g.log[0] && g.log[0].killedA === wanted[0][1]) aBous.push(b); }
    for (const lieu of lieux) for (let db = 0; db <= MAXB; db++) for (let L = 0; L <= (lieu === "terrain" ? 0 : MAXL); L++) {
      const o0 = { aArm, dArm, aBou: aBous[0] ?? 0, dBou: db, lieu, niveau: L };
      if (K.combat(r.A, r.D, o0).log[0]?.killedD !== wanted[0][0]) continue;
      for (const ab of aBous) { const g = K.combat(r.A, r.D, { ...o0, aBou: ab }); if (same(g.log)) found.push({ lieu, dBou: db, niveau: L, aBou: ab }); }
    }
    const aBouSet = [...new Set(found.map(f => f.aBou))], byLieu = l => found.filter(f => f.lieu === l);
    const range = arr => arr.length ? (Math.min(...arr) === Math.max(...arr) ? `${Math.min(...arr)}` : `${Math.min(...arr)} à ${Math.max(...arr)}`) : "–";
    const lieuBlock = (l, title) => { const f = byLieu(l); if (!lieux.includes(l)) return "";
      if (!f.length) return `<div class="card"><h3>${title}</h3><p class="muted">Aucune combinaison ne colle.</p></div>`;
      if (l === "terrain") return `<div class="card"><h3>${title}</h3><p>Bouclier du défenseur : <b>${range([...new Set(f.map(x => x.dBou))])}</b></p></div>`;
      const pairs = [...new Map(f.map(x => [x.dBou + "|" + x.niveau, x])).values()].sort((a, b) => a.dBou - b.dBou || a.niveau - b.niveau);
      return `<div class="card"><h3>${title}</h3><p class="note" style="margin:0 0 6px">${pairs.length} combinaison${pairs.length > 1 ? "s" : ""} possible${pairs.length > 1 ? "s" : ""} (Bouclier → niveau)</p>
        <div class="pairs">${pairs.slice(0, 60).map(p => `<span class="tag">Bouclier ${p.dBou} → niv. ${p.niveau}</span>`).join("")}${pairs.length > 60 ? `<span class="muted">…</span>` : ""}</div></div>`; };
    const hpLo = found.length ? Math.min(...found.map(f => 1 + .1 * f.dBou + (f.lieu === "dome" ? .1 + .05 * f.niveau : f.lieu === "loge" ? .3 + .15 * f.niveau : 0))) : 0;
    const hpHi = found.length ? Math.max(...found.map(f => 1 + .1 * f.dBou + (f.lieu === "dome" ? .1 + .05 * f.niveau : f.lieu === "loge" ? .3 + .15 * f.niveau : 0))) : 0;
    out.innerHTML = `
    <div class="kpis" style="margin-top:16px">
      <div class="card kpi"><div class="l">Armes attaquant</div><div class="v">${aArm ?? "?"}</div></div>
      <div class="card kpi"><div class="l">Bouclier attaquant</div><div class="v">${aBouSet.length ? range(aBouSet) : "?"}</div></div>
      <div class="card kpi"><div class="l">Armes défenseur</div><div class="v">${dArm ?? "?"}</div></div>
      <div class="card kpi"><div class="l">Vie du défenseur</div><div class="v">${found.length ? "×" + (hpLo.toFixed(2) === hpHi.toFixed(2) ? hpLo.toFixed(2) : hpLo.toFixed(2) + "–" + hpHi.toFixed(2)).replace(/\./g, ",") : "?"}</div><div class="muted">1 + 0,1 × Bouclier + lieu</div></div>
    </div>
    ${!found.length ? `<div class="card"><p class="down">Aucune combinaison de niveaux (0 à ${MAXB}) ne redonne exactement ce combat. Vérifie que le RC est complet.</p></div>` : `
    <div class="grid2">${lieuBlock("terrain", "Sur le terrain de chasse")}${lieuBlock("dome", "Dans le Dôme")}${lieuBlock("loge", "Dans la Loge impériale")}</div>
    <p class="note">Le Bouclier du défenseur et le niveau du Dôme ou de la Loge s'additionnent dans sa vie : plusieurs couples donnent souvent le même résultat. Si tu connais son Bouclier (par exemple grâce à un RC sur son terrain de chasse), lis directement le niveau correspondant.${r.lieu ? "" : " Le lieu n'apparaît pas dans le RC : choisis-le au-dessus pour affiner."}</p>`}`;
  };
}

// Les pages construisent leurs liens en « #/… » (route interne) ; ils sont convertis en vraies adresses.
const NO_SRV = /^\/(outils|jeu|simulateur)(\/|$|\?)/;
function toPath(r) { // r : route interne, ex. "/a/SHAN", "/tdc?a=X", "/outils/combat"
  r = r || "/"; if (!r.startsWith("/")) r = "/" + r;
  if (r.startsWith("/simulateur")) return "/outils/chasse";
  if (NO_SRV.test(r)) return r;
  const m = r.match(/^\/(a|j)\/(.*)$/);
  if (m) return `/s${SRV}/${m[1] === "a" ? "alliance" : "joueur"}/${m[2]}`;
  return `/s${SRV}${r === "/" ? "/" : r}`;
}
function fromPath() { // adresse actuelle -> route interne
  if (location.pathname.startsWith("/map-avant")) return location.hash.slice(1) || "/";
  let p = location.pathname.replace(/^\/s[1-5](?=\/|$)/, "") || "/";
  p = p.replace(/^\/alliance\//, "/a/").replace(/^\/joueur\//, "/j/");
  return p + location.search.replace(/[?&]srv=\d/, "").replace(/^&/, "?");
}
function go(r, replace) { const path = toPath(r); history[replace ? "replaceState" : "pushState"](null, "", path); route(); }
// liens internes : vraie adresse dans le href (clic du milieu, partage), navigation sans rechargement
function linkify(root) { root.querySelectorAll('a[href^="#/"]').forEach(a => a.setAttribute("href", toPath(a.getAttribute("href").slice(1)))); }
document.addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || a.target) return;
  const href = a.getAttribute("href") || "";
  if (href.startsWith("#/")) { e.preventDefault(); go(href.slice(1)); return; }
  if (href.startsWith("/") && !href.startsWith("/map-avant") && !/\.[a-z0-9]+$/i.test(href.split("?")[0]) && !location.pathname.startsWith("/map-avant")) {
    const m = href.match(/^\/s([1-5])(\/|$)/); if (m && +m[1] !== SRV) return; // autre serveur : rechargement complet
    e.preventDefault(); history.pushState(null, "", href); route(); }
});
addEventListener("popstate", route);

const resLabel = (n, r) => `${fmt(n)} de ${r}`;
const ticketRanges = buys => buys.map(b => b.first_num === b.last_num ? `n° ${b.first_num}` : `n° ${b.first_num} à ${b.last_num}`).join(", ");
const longDate = iso => new Date(new Date(iso).getTime() - 1000).toLocaleString("fr-FR", { weekday: "long", day: "numeric", month: "long", timeZone: "Europe/Paris" });
function countdown(iso) { const s = Math.max(0, Math.floor((Date.parse(iso) - Date.now()) / 1000));
  const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  return s <= 0 ? "Tirage en cours…" : `${d ? d + " j " : ""}${hh} h ${String(mm).padStart(2, "0")} min ${String(ss).padStart(2, "0")} s`; }
// vérifie un tirage passé directement depuis drand, dans le navigateur
async function verifyDraw(w) {
  const r = await fetch(`https://api.drand.sh/${w.drand_chain}/public/${w.drand_round}`).then(x => x.json());
  const ticket = Number(BigInt("0x" + r.randomness) % BigInt(w.tickets)) + 1;
  return r.randomness === w.randomness && ticket === w.winning_ticket;
}

async function route() {
  stopGame?.(); stopGame = null; stopMap?.(); stopMap = null; stopLot?.(); stopLot = null;
  charts.forEach(c => c.destroy()); charts = [];
  const h = fromPath(), [, a, b] = h.split("?")[0].split("/");
  const navKey = ({ a: "alliances", j: "joueurs", simulateur: "outils" }[a] ?? a ?? "");
  document.querySelectorAll("nav a").forEach(x => x.classList.toggle("on", (x.dataset.r ?? "") === navKey));
  app.innerHTML = `<p class="muted">Chargement…</p>`; scrollTo(0, 0);
  try {
    // /map-avant : seule la carte (éventuellement filtrée) reste ici ; les autres liens repartent vers le site normal
    if (location.pathname.startsWith("/map-avant") && a && a !== "carte") { location.replace(toPath(h)); return; }
    if (location.pathname.startsWith("/map-avant")) await carte(a === "carte" && b ? decodeURIComponent(b) : "", true);
    else if (a === "alliances") await alliances();
    else if (a === "a") await alliance(decodeURIComponent(b));
    else if (a === "joueurs") await joueurs();
    else if (a === "j") await joueur(b);
    else if (a === "jeu") await jeu();
    else if (a === "loterie") await (b === "admin" ? lotteryAdminPage() : lotteryPage());
    else if (a === "simulateur" || (a === "outils" && b === "chasse")) await simulateur();
    else if (a === "outils" && b === "combat") await combatPage();
    else if (a === "outils" && b === "rc") await rcCalc();
    else if (a === "outils") await outils();
    else if (a === "carte") await carte(b ? decodeURIComponent(b) : "");
    else if (a?.startsWith("tdc")) await tdc(new URLSearchParams(h.split("?")[1] || ""));
    else await home();
  } catch (e) { app.innerHTML = `<p class="down">Erreur : ${esc(e.message)}</p>`; }
  linkify(document);
}
